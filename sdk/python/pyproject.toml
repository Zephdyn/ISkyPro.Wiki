[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iskypro-sdk-v2"
version = "2.1.0-preview.1"
description = "ISkyPro Plugin SDK v2 stdio-jsonrpc runtime"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "ISkyPro" }
]

[project.urls]
Repository = "https://github.com/Zephdyn/ISkyPro.Wiki"
Documentation = "https://zephdyn.github.io/ISkyPro.Wiki/"

[tool.setuptools]
packages = ["iskypro_sdk_v2"]

[tool.setuptools.package-data]
iskypro_sdk_v2 = ["py.typed"]
